<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080b12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
  </defs>

  <!-- Background Dark Rounded Box -->
  <rect width="512" height="512" rx="112" fill="#080b12"/>
  
  <!-- Subtle Border with Neon Accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#00ff9d" stroke-opacity="0.35" stroke-width="12"/>
  
  <!-- Background Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#neonGlow)"/>

  <!-- Terminal Icon Container -->
  <g transform="translate(60, 60)">
    <!-- Terminal Prompt symbol >_ -->
    <polyline points="40,90 100,140 40,190" fill="none" stroke="#00ff9d" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="120" y1="190" x2="180" y2="190" stroke="#00f0ff" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- Big Bold Monospace PZ8 Text -->
  <text x="256" y="340" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="142" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-3">
    PZ8
  </text>

  <!-- Neon Green Status Dots (like header) -->
  <circle cx="410" cy="110" r="20" fill="#00ff9d" filter="drop-shadow(0 0 8px #00ff9d)"/>
  <circle cx="410" cy="110" r="10" fill="#ffffff"/>
  
  <!-- Subtitle IPTV MANAGER -->
  <text x="256" y="420" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#00ff9d" opacity="0.85" text-anchor="middle" letter-spacing="9">
    MANAGER
  </text>
</svg>
