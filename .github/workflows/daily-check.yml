name: Daily Expiration Check & Email

on:
  workflow_dispatch:
    inputs:
      force_resend:
        description: 'Forza invio anche se già inviato oggi (solo per test)'
        required: false
        default: false
        type: boolean

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install firebase-admin resend

      - name: Run notification script for all users
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FORCE_RESEND: ${{ inputs.force_resend || 'false' }}
        run: node scripts/daily-check.cjs
